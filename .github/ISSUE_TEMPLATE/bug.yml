name: Bug report / 问题反馈
description: 提供可脱敏复现的信息，不上传密钥、用户配置或私人原片。
title: "[Bug] "
body:
  - type: checkboxes
    attributes:
      label: 隐私与范围
      options:
        - label: 我没有附上 Key、.env、用户配置、完整日志或未授权的人像 / 录屏。
          required: true
        - label: 这不是需要私密报告的安全漏洞；已阅读 SECURITY.md。
          required: true
  - type: input
    attributes:
      label: 版本与环境
      description: commit / 版本、macOS 版本、芯片、Node 版本（源码运行时）；不必提供用户名或机器序列号。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 复现步骤、期望与实际结果
      description: 请说明本地待机 / 文字 Agent / 实时模式，以及是否安装 SDK。不要为了复现反复创建收费会话。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 最小脱敏证据（可选）
      description: 只贴相关错误码。截图请裁掉桌面 / 个人资料；不要粘贴完整 config 或日志目录。
